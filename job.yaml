apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: automation-hub
spec:
  template:
    spec:
      template:
        spec:
          timeoutSeconds: 900
          maxRetries: 1
          containers:
          - image: gcr.io/automation-hub-502406/automation-hub:latest
            env:
            - name: HEADLESS
              value: "true"
            - name: GOOGLE_SHEET_ID
              value: "1gTj8_riTV7gtwNDrgV_1hke_aTMGx1nKbqKQfvTWa7E"
            - name: GOOGLE_CREDENTIALS
              value: "/secrets/service-account.json"
            volumeMounts:
            - name: google-creds
              mountPath: /secrets
              readOnly: true
          volumes:
          - name: google-creds
            secret:
              secretName: google-service-account
              items:
              - key: latest
                path: service-account.json